name: Voxel Transport CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-simulation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # Removed 'cache: "pip"' because requirements.txt is not present yet

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib

      - name: Run Voxel Transport Simulation Script
        run: |
          python src/voxel_engine.py

      - name: Archive Simulation Visualizations
        uses: actions/upload-artifact@v4
        with:
          name: simulation-output-plots
          path: '*.png'
          
